name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the older run pointless; cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Pinned so a Bun release cannot turn a green branch red on its own. The floor the
      # code needs is `engines.bun` in package.json; this is the version CI proves.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # Needs dist from the step above; fails without a login otherwise.
      - run: bun run --cwd apps/worker deploy --dry-run

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fomopulse:ci .
